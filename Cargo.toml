[workspace]
resolver = "3"
members = [
    "crates/neko-wire",
    "crates/neko-session",
    "crates/neko-carrier",
    "crates/neko-cli",
    "crates/neko-crypto",
    "crates/neko-reliable",
    "crates/neko-observe",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
