name: Rust CI

on:
  push:
  pull_request:

jobs:
  stable:
    name: stable checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/check.sh

  fuzz-smoke:
    name: nightly decode fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.12.0 --locked
      - run: test -f docs/specs/nekomusume-session-v0.md
      - run: test -f LICENSE-MIT && test -f LICENSE-APACHE
      - run: grep -q 'license = "MIT OR Apache-2.0"' fuzz/Cargo.toml
      - run: cargo fuzz build decode
      - run: cargo fuzz run decode -- -max_total_time=30 -max_len=8192
